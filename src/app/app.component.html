<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .responseField {
      height: 500px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 20px;
      position: relative;
      background: white;
      overflow-y: auto;
      padding: 15px;
    }

    .input-section {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-container {
      flex: 1;
      min-width: 200px;
    }

    .form-control {
      width: 100%;
      height: 38px;
      padding: 8px 12px;
    }

    .btn-container {
      display: flex;
      align-items: flex-start;
    }

    .progress-bar {
      height: 4px;
      width: 100%;
      position: absolute;
      bottom: 0;
      left: 0;
      background-color: #f0f0f0;
    }

    .progress-bar-inner {
      height: 100%;
      width: 30%;
      background-color: #007bff;
      animation: progress 1s infinite linear;
    }

    @keyframes progress {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(400%);
      }
    }

    @media (max-width: 576px) {
      .input-section {
        flex-direction: column;
      }
      
      .btn-container {
        width: 100%;
      }
      
      .btn {
        width: 100%;
      }
      
      .input-container {
        margin-bottom: 10px;
      }
    }
    .copyright {
      text-align: center;
      padding: 20px 0;
      color: #666;
      font-size: 14px;
      margin-top: 20px;
      border-top: 1px solid #eee;
    }

    .portfolio-link {
      color: #007bff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .portfolio-link:hover {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="responseField">
      <span class="border border-secondary">{{responseText}}</span>
      <div *ngIf="progress">

        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      </div>
    </div>

    <div class="input-section">
      <div class="input-container">
        <input type="text" class="form-control" placeholder="Type your text here" name="inputText" [(ngModel)]="inputText">
      </div>
      <div class="btn-container">
        <button type="button" class="btn btn-primary" (click)="generateText()" (keydown.enter)="generateText()">Generate Text</button>
      </div>
    </div>

    <div class="copyright">
      © 2025 <a href="https://amnnrajbhar.github.io/info/" target="_blank" class="portfolio-link">Aman Rajbhar</a>
    </div>
  </div>
</body>
</html>
